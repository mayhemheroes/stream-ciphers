[package]
name = "stream-ciphers-mayhem-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cipher = "0.5"
rand = "0.8.5"
rand_pcg = "0.3.1"

[dependencies.rabbit]
path = "../../rabbit"

[dependencies.hc-256]
path = "../../hc-256"

[dependencies.salsa20]
path = "../../salsa20"

# Prevent this from interfering with the upstream workspace.
[workspace]
members = ["."]

[[bin]]
name = "rabbit"
path = "fuzz_targets/rabbit.rs"
test = false
doc = false

[[bin]]
name = "hc-256"
path = "fuzz_targets/hc-256.rs"
test = false
doc = false

[[bin]]
name = "salsa20"
path = "fuzz_targets/salsa20.rs"
test = false
doc = false
